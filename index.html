<style>
        body {
            background-color: #020617; /* Level 0 floor */
            color: #d4e4fa; /* on-background */
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glow-effect {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
        }

        .text-gradient {
            background: linear-gradient(90deg, #c0c1ff, #c3f400);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .text-gradient-animated {
            background: linear-gradient(90deg, #c0c1ff, #c3f400, #c0c1ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(195, 244, 0, 0.4), 0 0 40px rgba(195, 244, 0, 0.15); }
            50% { text-shadow: 0 0 45px rgba(195, 244, 0, 0.9), 0 0 90px rgba(195, 244, 0, 0.5); }
        }
        .glow-pulse-text {
            animation: glow-pulse 2.4s ease-in-out infinite;
        }

        @keyframes float-y {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .float-text {
            animation: float-y 5s ease-in-out infinite;
        }
